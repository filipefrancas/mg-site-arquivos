<script>
/* MG: catálogo sem preço - tira "ordenar por preço" e troca "Mais vendidos" */

  function limpa() {
    document.querySelectorAll('.js-sort-by-private option, .js-sort-by option').forEach(function (o) {
      if (/^price/.test(o.value)) o.remove();
      else if (o.value === 'best-selling') o.text = 'Mais procurados';

})();

<script>
/* MG: no celular, cada linha do menu Produtos vira link direto (sem abrir as montadoras) */
(function () {
  function simplifica() {
    document.querySelectorAll('.item-with-subitems > button.js-modal-open-private').forEach(function (bt) {
      if (/^produtos$/i.test(bt.textContent.trim())) return;
      var sub = document.querySelector(bt.getAttribute('data-target'));
      var ver = sub && sub.querySelector('.modal-body > .nav-item > a.nav-list-link');
      if (!ver) return;
      var a = document.createElement('a');
      a.className = 'nav-list-link';
      a.href = ver.getAttribute('href');
      a.textContent = bt.textContent.trim();
      var it = bt.parentElement;
      it.classList.remove('item-with-subitems');
      bt.replaceWith(a);
      if (sub.parentElement === it) sub.remove();
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', simplifica); else simplifica();
})();
</script>
